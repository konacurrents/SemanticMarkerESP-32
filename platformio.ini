; PlatformIO — shared codebase for Atom Lite + AtomS3 Lite
; Board selection: -e m5stack-atom  or  -e m5stack-atoms3
; Active feeder define: ESP_M5_ATOM_LITE (S3 env also sets ESP_M5_ATOM_S3)

[platformio]
; Default for IDE Build/Upload/Monitor. Switch back to m5stack-atom for Atom Lite.
default_envs = m5stack-atoms3

[env:m5stack-atom]
; Pin classic PlatformIO Espressif platform (avoids broken pioarduino 55.x).
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino

; Match Arduino "Minimal SPIFFS (1.9MB APP with OTA / 190KB SPIFFS)"
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

monitor_speed = 115200
upload_speed = 115200
upload_port = COM4
monitor_port = COM4

; Project root is NOT added to -I (a file named LIST would shadow C++ <list>).
; Modules use ../../Defines.h; main.cpp uses ../Defines.h
build_flags =
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  m5stack/M5StickCPlus@^0.1.0
  m5stack/M5Atom@^0.1.0
  fastled/FastLED@3.5.0
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
  h2zero/NimBLE-Arduino@^1.4.3
  paulstoffregen/Time@^1.6.1
  m5stack/M5Chain@^1.0.8
  m5stack/M5Unit-Sonic@^0.0.2
  m5stack/M5-DLight@^0.0.5

lib_ldf_mode = deep+

; -----------------------------------------------------------------------------
; AtomS3 Lite (ESP32-S3) — same feeder behavior, remapped GPIOs via BoardPins.h
; Flash: pio run -e m5stack-atoms3 -t upload
; May need download mode: hold reset ~2s until green LED, then release.
; -----------------------------------------------------------------------------
[env:m5stack-atoms3]
platform = espressif32@6.5.0
board = m5stack-atoms3
framework = arduino

board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

monitor_speed = 115200
upload_speed = 921600
; AtomS3 Lite native USB (this unit); Atom Lite also uses COM4 in [env:m5stack-atom]
upload_port = COM4
monitor_port = COM4

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DESP_M5_ATOM_S3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  m5stack/M5AtomS3@^1.0.0
  m5stack/M5Unified@^0.1.0
  m5stack/M5GFX@^0.1.0
  fastled/FastLED@3.5.0
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8
  h2zero/NimBLE-Arduino@^1.4.3
  paulstoffregen/Time@^1.6.1
  m5stack/M5Chain@^1.0.8
  m5stack/M5Unit-Sonic@^0.0.2
  m5stack/M5-DLight@^0.0.5

lib_ldf_mode = deep+
